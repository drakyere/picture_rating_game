<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Images Ratin Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            color: #333;
        }
        
        body::before {
            content: "";
            background: url('{{ url_for("static", filename="pexels_images/bg_image.jpg") }}') no-repeat center center;
            background-size: cover;
            filter: blur(8px);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            max-width: 800px;
            width: 90%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        h1 {
            color: #2e8b57;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        
        p.description {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .demographic-form {
            text-align: center;
            margin: 30px 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        .btn {
            display: inline-block;
            background-color: #2e8b57;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.1rem;
            transition: background-color 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            background-color: #3cb371;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Beautiful Images Rating Game</h1>
        <p class="description">
            Welcome to our aesthetic research study! We're exploring how people perceive beauty in images. 
            You'll be shown a series of images to rate based on your personal preferences. 
            The entire process should take about 5 minutes.
        </p>
        
        <div class="demographic-form">
            <h2>About You</h2>
            <form action="{{ url_for('demographic') }}" method="POST">
                <div class="form-group">
                    <label for="age">Your Age:</label>
                    <input type="number" id="age" name="age" min="13" max="120" required>
                </div>
                
                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select your gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="non-binary">Non-binary</option>
                        <option value="other">Other</option>
                        <option value="prefer-not">Prefer not to say</option>
                    </select>
                </div>
                
                <button type="submit" class="btn">Continue to Rating</button>
            </form>
        </div>
    </div>
</body>
</html>
